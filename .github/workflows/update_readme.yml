name: Update Profile Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update-profile:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        run: |
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Generate profile statistics
        env:
          USER_NAME: Siwoo4985
        run: python3 generate_readme.py

      - name: Commit updated SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: refresh profile statistics [skip ci]'
          gh auth setup-git --hostname github.com
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
