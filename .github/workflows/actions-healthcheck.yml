name: Actions checkout health check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/actions-healthcheck.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify checkout
        run: echo "checkout-ok"
