name: Actions permission health check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/actions-healthcheck.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify write-token startup
        run: echo "permissions-ok"
