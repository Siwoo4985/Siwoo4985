name: One-time bot PR for YOLO

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/achievement-yolo.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  create-bot-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create bot-authored pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: achievement/yolo-bot-20260902-v3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete achievement/yolo-bot-20260902 || true
          git switch -c "$BRANCH_NAME"
          sed -i 's/- \[ \] YOLO (requires merging a qualifying pull request without review)/- [x] YOLO (merged a bot-authored pull request without review)/' ACHIEVEMENTS.md
          git rm .github/workflows/achievement-yolo.yml
          git add ACHIEVEMENTS.md
          git commit -m "docs: record YOLO achievement"
          git push origin "$BRANCH_NAME"
          gh pr create --base main --head "$BRANCH_NAME" --title "docs: record YOLO achievement" --body "Bot-authored one-time PR for the GitHub YOLO achievement. This PR removes its temporary workflow."
